[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-owner"
version = "0.1.0"
description = "Local-first, dependency-aware issue tracker"
requires-python = ">=3.10"
dependencies = ["pydantic"]

[project.scripts]
po = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["cli*", "core*", "storage*"]
